name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24"
      run-format-check:
        required: false
        type: boolean
        default: true
      run-lint:
        required: false
        type: boolean
        default: true
      run-typecheck:
        required: false
        type: boolean
        default: true
      run-test:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true

jobs:
  ci:
    name: Node ${{ inputs.node-version }} CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - run: npm ci
      - if: inputs.run-format-check
        run: npm run format:check
      - if: inputs.run-lint
        run: npm run lint
      - if: inputs.run-typecheck
        run: npm run typecheck
      - if: inputs.run-test
        run: npm test
      - if: inputs.run-build
        run: npm run build
